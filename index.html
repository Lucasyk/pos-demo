<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1" />
		<meta
			name="apple-mobile-web-app-capable"
			content="yes" />
		<title>レジ | POS</title>
    <link rel="stylesheet" href="style.css">
	</head>
	<body>
		<header>
			<div>
				<h1>Cafe tayo</h1>
				<small>サンプル店舗</small>
			</div>
			<button id="historyBtn">売上履歴</button>
		</header>
		<div
			id="status"
			role="alert"></div>
		<main>
			<section class="panel">
				<h2>メニュー</h2>
				<p class="muted">商品をタップして追加</p>
				<div
					class="tabs"
					id="tabs"></div>
				<div
					class="menu"
					id="menu"></div>
			</section>
			<section class="panel">
				<h2>
					ご注文
					<small
						class="muted"
						id="count"></small>
				</h2>
				<div id="cart"></div>
				<div class="total">
					<span>合計（税込）</span><span id="total">¥0</span>
				</div>
				<button
					class="primary wide"
					id="checkout">
					お会計</button
				><button
					class="wide secondary"
					id="clear">
					注文をクリア
				</button>
			</section>
		</main>
		<dialog id="pay">
			<h2>お会計</h2>
			<div class="total"><span>合計</span><span id="due"></span></div>
			<div class="methods">
				<button
					id="cash"
					class="active">
					現金</button
				><button id="card">キャッシュレス</button>
			</div>
			<div id="cashFields">
				<label for="received">お預かり金額</label
				><input
					id="received"
					type="number"
					inputmode="numeric"
					min="0"
					step="1"
					placeholder="0" /><button id="exact">ちょうど</button>
				<div class="total"><span>お釣り</span><span id="change">—</span></div>
			</div>
			<p
				class="muted"
				id="cardNote"
				hidden>
				外部端末で決済が完了してから登録してください。
			</p>
			<button
				id="register"
				class="primary wide">
				会計を登録</button
			><button
				class="wide secondary"
				onclick="pay.close()">
				戻る
			</button>
		</dialog>
		<dialog id="receiptDialog">
			<h2>会計完了</h2>
			<div
				class="receipt"
				id="receipt"></div>
			<button
				class="primary wide"
				onclick="window.print()">
				レシート印刷</button
			><button
				class="wide secondary"
				onclick="receiptDialog.close()">
				次のお客様
			</button>
		</dialog>
		<dialog id="history">
			<h2>売上履歴</h2>
			<div class="total"><span>本日の売上</span><span id="daily"></span></div>
			<div id="sales"></div>
			<button
				class="wide secondary"
				id="export">
				CSV出力（全件）</button
			><button
				class="wide secondary"
				onclick="historyDialog.close()">
				閉じる
			</button>
		</dialog>
		<script src="script.js">
			
		</script>
	</body>
</html>
